name: さくらへ自動反映

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

concurrency:
  group: deploy-sakura
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: パスワードが設定されているか確認
        if: env.FTP_PASSWORD == ''
        run: echo "FTP_PASSWORD がまだ設定されていないため、反映をスキップします。"
      - uses: actions/checkout@v4
        if: env.FTP_PASSWORD != ''
      - name: さくらのサーバーへ送る（SFTP）
        if: env.FTP_PASSWORD != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "colors2,$FTP_PASSWORD" sftp://colors2.sakura.ne.jp -e "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; mirror -R --verbose=1 --only-newer --no-perms ./site/ /home/colors2/www/robotaxi-lab/; bye"
